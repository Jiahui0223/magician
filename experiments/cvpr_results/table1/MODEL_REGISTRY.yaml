# CVPR Table 1（Macarons++ 室外）模型注册表
# 生成：2026-11-03，只读审计（没有训练、没有启动运行、没有修改任何 checkpoint 或历史结果）。
# 依据：experiments/CHECKPOINTS.md、work_dirs/checkpoints/exp6_*/MANIFEST.json（完整 sha256）、
#       experiments/CHECKPOINTS_VERIFY.json（2026-11-02 19:23:17，七个实验 all_ok = true）、各实验配置 / 启动脚本 / 规划器日志。
# 详细出处（file:line）见同目录 CHECKPOINT_AUDIT.md 与 EVALUATION_AUDIT.md；历史 episode 逐条清单见
#   audit/historical_outdoor_episodes.{json,csv}（由 scripts/audit_model_episodes.py 只读生成）。
# 读取方：scripts/aggregate.py / validate.py / plot.py 只用 models[*].id / label / status / sha256；其余字段供人工核对。
version: table1_model_registry_v1
created: "2026-11-03"

conventions:
  repo: /bsuscratch/jiahuizhang/projects/occupancy/seen2scene
  shell_prelude: |
    R=/bsuscratch/jiahuizhang/projects/occupancy/seen2scene; cd $R
    MG="env -u LD_PRELOAD -u PYTHONPATH /bsuscratch/jiahuizhang/envs/magician/bin/python"
    T1W=$R/work_dirs/cvpr_results/table1/g3      # 建议的新输出根目录（不得位于任何历史目录或 work_dirs/exp5_future_view/task1、task2 之下）
    S=<scene>; K=<start 0..4>; G=<gpu>
    export PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
    unset T3_CKPT V4_P1_MODE V3_CKPT V4_CKPT       # 这些环境变量会被规划器子进程继承并改变权重 / P1 模式
  simulator: >-
    所有组共用冻结的 M 协议模拟器（magician 环境）：task2/scripts/t24_out_sim.py -> task1/scripts/v2_sim.run ->
    exp3b m_t6_sim.EpisodeSim（官方 settings 网格、官方邻居 -> get_valid_neighbors -> GT 线段检测、无合法动作时 hover、
    带种子的观测与 10% 采样、MAGICIAN 式覆盖率、逐步 checkpoint 与逐位续跑）。预算 C0 + 100 moves = 101 帧。
  root_warning: >-
    t24_out_sim.py 及其所有包装（t33_out_sim / da_out_sim / sim_out_v3 / sim_out_v4 / sim_out_v5）不给 --root 时默认写入
    work_dirs/exp5_future_view/task2/eval/outdoor/closed_loop/<group>（历史 Task 2 目录，t24_out_sim.py:70）。新运行必须显式给 --root。
  density_codes:
    S10: 模拟器 10% 采样点构成的稀疏 P1（冻结 m_p1.P1Fusion）
    D100: 每帧全部有效深度像素构成的 FullDepth-P1（p1_full.P1FusionFull）
  p1_modes:
    sparse: S10 推理输入 / S10 DistP1 评分（历史 B0、V2O、E2S）
    b2: D100 推理输入 / S10 DistP1 评分（只替换 caster.band_dil；历史 B2、E2D、V3、V3.1、V4、V4C、V5）
    full: D100 推理输入 / D100 评分（历史 B1）
  status_values:
    READY: checkpoint sha256 已核对、启动链存在且评估代码自历史运行后未变或已逐位复现、Dev-3 + Test-3 历史 episode 30/30 可复用
    PENDING_ALIGNMENT: 需要先对齐（协议 / 代码 / 权重）才能与其他行同表
  blocked_scenes_all_models:
    sofia_church: >-
      冻结模拟器从 MAGICIAN_clean_9521d69 导入 load_scene（m_magician_replay.py:38,47；m_t6_sim.py:51），其多纹理分支含
      `torch.tensor()`（MAGICIAN_clean_9521d69/macarons/utility/macarons_utils.py:470-494），而 sofia_church 的 .mtl 有 4 个 map_Kd，
      其余 14 个场景各 1 个。已实测：同目录 load_test.log:15（数据集审计代理）在 EpisodeSim 阶段报
      TypeError: tensor() missing 1 required positional arguments。另外我们的 V2 系列规划器（含 V3/V4/V5）在
      v2_planner.py:112 调用 t5_diagnostic.scene_geometry -> frame_of（t5_diagnostic.py:110-112），读取
      work_dirs/exp3b_macaronspp_transfer/task1_protocol/em2_windows.json，其中只有 14 个场景、没有 sofia_church（KeyError）。
      官方 e697009 克隆中该行已注释（external/MAGICIAN/macarons/utility/macarons_utils.py:481）。

