# EXP6 V5 / F1 -- common training protocol of both arms (frozen 2026-11-03 before any F1 training; PROTOCOL.md)
version: f1_common_v1
parent:
  name: V2-Mix-B0 (EMA@17.5k; B0 = S10/S10, B2 = D100/S10 are the same weights)
  ckpt: work_dirs/weights/W21_exp5_v2mix/W21-1_V2Mix_best/ema_017500.pt
  sha256: 343f41ab8d566c52007c881b5f32375c3253dd8f1c7a0d8a906d412a165e4516
  weights: ema            # the checkpoint holds only the EMA state (keys ema / step / model_cfg)
  grandparent: {name: V2 Original Outdoor S10 EMA@60k, ckpt: work_dirs/weights/W20_exp5_v2/W20-1_V2_original_ema60k/ema_060000.pt,
                sha256: a379c0fb9d7d80266a430ab6f48f39315fad54fb650c6c3740a999a02db079fc}
data:
  config: data_v1.json                     # exp5 task1 frozen data config (state weights, max candidates)
  domain: outdoor Macarons++ only (no MP3D)
  train_set: train6_minus_Sc                # Train-6 minus the S-c held-out trajectories (v2_data.load_split)
  held_set: S-c (monitoring only)
  density: S10                              # T1.1 sparse shards (t22_data.CompactViewData default root = work_dirs/exp5_future_view/task1/data/views)
  labels: existing S10 b / y / UNKNOWN masks of the shards (identical for both arms)
steps: 5000
batch_views: 64            # global; 4 ranks x 16 views
states_per_batch: 8        # global; 4 ranks x 2 states
world_size: 4
betas: [0.9, 0.99]
weight_decay: 0.01
grad_clip: 1.0
ema: 0.999                 # model and EMA both start from the parent EMA weights (new modules: same init in model and EMA)
precision: bf16
seed: 0                    # numpy sample stream default_rng([seed, rank]); torch seed + 1000 * rank (eps / tau) -> identical streams in both arms
stale_p: 0.5
stale_max: 9
loss: L_FM only (v2_data.fm_sum, global labelled-ray normalisation); no L_surf, no L_bridge, no teacher, no extra heads
ckpt_every: 500            # ckpt_last (model, EMA, optimizer, step, RNG, config hash, parent sha) -> resumable
ema_save_steps: [0, 1000, 2000, 3000, 4000, 5000]
eval_every: 1000           # FM loss / samples of the EMA on train_sub and S-c (monitoring only, no selection)
eval_sets: {train_sub: 1024, sc_sub: 2048}
eval_tau: [0.1, 0.3, 0.5, 0.7, 0.9]
preregistered_checkpoints: [2000, 5000]     # evaluated in G1 / G2 / G3; selection only on Dev-3 (f1_eval.yaml)
smoke: {overfit_steps: 200, short_steps: 300, short_stage1: 150, emulate_world: 4}
